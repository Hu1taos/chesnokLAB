<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дорожные знаки</title>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; font-family: Arial, sans-serif; color: #222; background: #f4f6f8; }
    h1 { text-align: center; margin: 0 0 10px; color: #183b63; }
    .intro { text-align: center; margin: 0 auto 25px; max-width: 700px; line-height: 1.5; }
    .gallery { max-width: 900px; margin: auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 18px; }
    .sign { position: relative; margin: 0; min-height: 170px; padding: 12px; text-align: center; background: white; border: 1px solid #d5dce4; border-radius: 10px; box-shadow: 0 2px 7px #00000012; }
    .sign img { width: 112px; height: 112px; object-fit: contain; }
    .sign figcaption { margin-top: 7px; font-size: 13px; font-weight: 600; }
    .code { color: #53677e; font-weight: 700; }
    .ui-tooltip { max-width: 260px; padding: 9px 12px; font-size: 13px; line-height: 1.4; }
    footer { margin: 25px auto 0; text-align: center; color: #687482; font-size: 12px; line-height: 1.5; }
    footer a { color: #315d8a; }
    @media (max-width: 480px) { body { padding: 16px; } .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <h1>Дорожные знаки</h1>
  <p class="intro">Наведите указатель мыши на любой знак, чтобы увидеть его описание.</p>

  <main class="gallery">
      <figure class="sign" data-hint="Впереди участок дороги, на котором возможно скольжение.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_1.15.svg" alt="Российский дорожный знак 1.15: Скользкая дорога" loading="lazy">
        <figcaption><span class="code">1.15</span> — Скользкая дорога</figcaption>
      </figure>
      <figure class="sign" data-hint="Впереди неровный участок дороги.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_1.16.svg" alt="Российский дорожный знак 1.16: Неровная дорога" loading="lazy">
        <figcaption><span class="code">1.16</span> — Неровная дорога</figcaption>
      </figure>
      <figure class="sign" data-hint="Впереди находится светофор.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_1.8.svg" alt="Российский дорожный знак 1.8: Светофорное регулирование" loading="lazy">
        <figcaption><span class="code">1.8</span> — Светофорное регулирование</figcaption>
      </figure>
      <figure class="sign" data-hint="Впереди возможен выход пешеходов на дорогу.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_1.22.svg" alt="Российский дорожный знак 1.22: Пешеходный переход" loading="lazy">
        <figcaption><span class="code">1.22</span> — Пешеходный переход</figcaption>
      </figure>
      <figure class="sign" data-hint="На участке ведутся дорожные работы.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_1.25.svg" alt="Российский дорожный знак 1.25: Дорожные работы" loading="lazy">
        <figcaption><span class="code">1.25</span> — Дорожные работы</figcaption>
      </figure>
      <figure class="sign" data-hint="Даёт преимущество при проезде перекрёстков.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_2.1.svg" alt="Российский дорожный знак 2.1: Главная дорога" loading="lazy">
        <figcaption><span class="code">2.1</span> — Главная дорога</figcaption>
      </figure>
      <figure class="sign" data-hint="Впереди перекрёсток равнозначных дорог.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_1.6.svg" alt="Российский дорожный знак 1.6: Пересечение равнозначных дорог" loading="lazy">
        <figcaption><span class="code">1.6</span> — Пересечение равнозначных дорог</figcaption>
      </figure>
      <figure class="sign" data-hint="Необходимо остановиться перед стоп-линией или знаком.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_2.5.svg" alt="Российский дорожный знак 2.5: Движение без остановки запрещено" loading="lazy">
        <figcaption><span class="code">2.5</span> — Движение без остановки запрещено</figcaption>
      </figure>
      <figure class="sign" data-hint="Движение организовано по кругу.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_4.3.svg" alt="Российский дорожный знак 4.3: Круговое движение" loading="lazy">
        <figcaption><span class="code">4.3</span> — Круговое движение</figcaption>
      </figure>
      <figure class="sign" data-hint="Движение разрешено только в указанном направлении.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_5.5.svg" alt="Российский дорожный знак 5.5: Дорога с односторонним движением" loading="lazy">
        <figcaption><span class="code">5.5</span> — Дорога с односторонним движением</figcaption>
      </figure>
      <figure class="sign" data-hint="Знак обозначает место остановки автобуса.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_5.16.svg" alt="Российский дорожный знак 5.16: Место остановки автобуса" loading="lazy">
        <figcaption><span class="code">5.16</span> — Место остановки автобуса</figcaption>
      </figure>
      <figure class="sign" data-hint="Запрещает движение грузовых автомобилей.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_3.4.svg" alt="Российский дорожный знак 3.4: Движение грузовых автомобилей запрещено" loading="lazy">
        <figcaption><span class="code">3.4</span> — Движение грузовых автомобилей запрещено</figcaption>
      </figure>
      <figure class="sign" data-hint="Пешеходам запрещено двигаться по этому участку.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_3.10.svg" alt="Российский дорожный знак 3.10: Движение пешеходов запрещено" loading="lazy">
        <figcaption><span class="code">3.10</span> — Движение пешеходов запрещено</figcaption>
      </figure>
      <figure class="sign" data-hint="Запрещает движение транспорта массой больше указанной на знаке.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_3.11.svg" alt="Российский дорожный знак 3.11: Ограничение массы" loading="lazy">
        <figcaption><span class="code">3.11</span> — Ограничение массы</figcaption>
      </figure>
      <figure class="sign" data-hint="Запрещает въезд всех транспортных средств в данном направлении.">
        <img src="https://commons.wikimedia.org/wiki/Special:FilePath/RU_road_sign_3.1.svg" alt="Российский дорожный знак 3.1: Въезд запрещён" loading="lazy">
        <figcaption><span class="code">3.1</span> — Въезд запрещён</figcaption>
      </figure>
  </main>

  <footer>
    Изображения — настоящие стандартные российские дорожные знаки из Wikimedia Commons.<br>
    Для загрузки изображений требуется подключение к интернету.
    <a href="https://commons.wikimedia.org/wiki/Category:SVG_road_signs_in_Russia" target="_blank" rel="noopener">Источник изображений</a>.
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"></script>
  <script>
    $(function () {
      $(".sign").tooltip({
        items: "figure",
        content: function () {
          return $(this).attr("data-hint");
        }
      });
    });
  </script>
</body>
</html>
